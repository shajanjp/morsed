<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>morsed</title>
        <meta name="description" content="Practice Morse code with real words and sentences" />
        <meta name="theme-color" content="#323437" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90' fill='%23d1d0c5'>⎍</text></svg>" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet" />
        <link rel="stylesheet" href="styles/style.css" />

        <style>
            /* ── Design tokens ─────────────────────────────── */
            :root {
                /* Colors */
                --color-primary:       #d1d0c5;
                --color-secondary:     #a1a19b;
                --color-tertiary:      #7b7a74;
                --color-neutral:       #323437;
                --color-surface:       #2a2c2f;
                --color-on-surface:    #d1d0c5;
                --color-background:    #323437;
                --color-accent:        #e2b714;
                --color-border:        #3a3d41;
                --color-muted:         #6b6d72;
                --color-inverse:       #ffffff;
                --color-error:         #ff6b6b;

                /* Typography */
                --font-mono:           'Roboto Mono', 'SF Mono', 'Fira Code', monospace;
                --fs-display:          32px;
                --fs-headline-lg:      27px;
                --fs-headline-md:      23px;
                --fs-headline-sm:      19px;
                --fs-body:             16px;
                --fs-body-sm:          14px;
                --fs-label:            12px;
                --fw-bold:             700;
                --fw-regular:          400;
                --lh-tight:            1.2;
                --lh-normal:           1.4;
                --lh-relaxed:          1.5;

                /* Rounded */
                --radius-sm:           4px;
                --radius-md:           8px;
                --radius-lg:           16px;
                --radius-xl:           24px;
                --radius-full:         9999px;

                /* Spacing */
                --space-xs:            2px;
                --space-sm:            6px;
                --space-md:            10px;
                --space-lg:            14px;
                --space-xl:            32px;
                --space-gutter:        16px;
                --space-section:       48px;

                /* Component tokens */
                --btn-primary-bg:      var(--color-primary);
                --btn-primary-text:    var(--color-neutral);
                --btn-primary-hover:   var(--color-inverse);
                --btn-secondary-bg:    transparent;
                --btn-secondary-text:  var(--color-primary);
                --btn-secondary-border:var(--color-border);
                --btn-tertiary-text:   var(--color-muted);
                --card-bg:             var(--color-surface);
                --card-text:           var(--color-on-surface);
                --card-radius:         var(--radius-lg);
                --card-padding:        var(--space-xl);
                --input-bg:            var(--color-neutral);
                --input-text:          var(--color-primary);
                --input-radius:        var(--radius-sm);
                --chip-bg:             var(--color-neutral);
                --chip-text:           var(--color-muted);
                --banner-bg:           var(--color-accent);
                --banner-text:         var(--color-neutral);
            }
        </style>
    </head>
    <body>
        <!-- ── Top bar ─────────────────────────────────────── -->
        <header id="top" role="banner">
            <div id="logo" class="clickable" onclick="startSession()" tabindex="0" role="button" aria-label="Start new session">morsed</div>

            <div id="timer-modes" role="group" aria-label="Timer duration">
                <button class="timer-btn active" data-time="30" aria-pressed="true">30s</button>
                <button class="timer-btn" data-time="60" aria-pressed="false">1m</button>
                <button class="timer-btn" data-time="180" aria-pressed="false">3m</button>
            </div>

            <button id="mute-btn" class="mute-btn" title="Mute sounds" aria-label="Toggle sound">
                <svg id="mute-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                    <path d="M20.807 4.29a1 1 0 0 0-1.415 1.415 8.913 8.913 0 0 1 0 12.59 1 1 0 0 0 1.415 1.415 10.916 10.916 0 0 0 0-15.42Z" />
                    <path d="M18.1 7.291a1 1 0 0 0-1.42 1.415 4.662 4.662 0 0 1 0 6.588 1 1 0 0 0 1.42 1.415 6.666 6.666 0 0 0 0-9.418Z" />
                    <path d="M13.82.2A12.054 12.054 0 0 0 6.266 5H5a5.008 5.008 0 0 0-5 5v4a5.008 5.008 0 0 0 5 5h1.266a12.059 12.059 0 0 0 7.554 4.8.917.917 0 0 0 .181.017 1 1 0 0 0 1-1V1.186A1 1 0 0 0 13.82.2ZM13 21.535a10.083 10.083 0 0 1-5.371-4.08A1 1 0 0 0 6.792 17H5a3 3 0 0 1-3-3v-4a3 3 0 0 1 3-3h1.8a1 1 0 0 0 .837-.453A10.079 10.079 0 0 1 13 2.465Z" />
                </svg>
            </button>

            <div id="stats" role="status" aria-live="polite">
                <div class="stat" id="stat-timer">
                    <span class="stat-value" id="timer-value">30s</span>
                    <span class="stat-label">time</span>
                </div>
                <div class="stat" id="stat-cpm">
                    <span class="stat-value" id="cpm-value">0</span>
                    <span class="stat-label">cpm</span>
                </div>
                <div class="stat" id="stat-accuracy">
                    <span class="stat-value" id="accuracy-value">100</span>
                    <span class="stat-label">acc</span>
                </div>
                <div class="stat" id="stat-streak">
                    <span class="stat-value" id="streak-value">0</span>
                    <span class="stat-label">streak</span>
                </div>
            </div>
        </header>

        <!-- ── Main typing area ────────────────────────────── -->
        <main id="main">
            <!-- Word track (line of words) -->
            <div id="word-track-container">
                <div id="word-track" aria-label="Words to type"></div>
            </div>

            <!-- Character track within current word -->
            <div id="char-track-container">
                <div id="char-track" aria-label="Characters in current word"></div>
            </div>

            <!-- Current character + Morse input -->
            <div id="input-area">
                <div id="current-character" aria-label="Current character">
                    <span id="char-display"></span>
                    <span id="cursor" aria-hidden="true">|</span>
                </div>
                <div id="morse-output" aria-label="Morse code input">
                    <span id="morse-chars"></span>
                </div>
            </div>

            <!-- Keyboard hints -->
            <div id="hints">
                <span class="hint-key">.</span> dit
                <span class="hint-sep" aria-hidden="true">&middot;</span>
                <span class="hint-key">&minus;</span> dah
            </div>

            <!-- Mobile dit / dah buttons -->
            <div id="mobile-controls" role="group" aria-label="Morse input buttons">
                <button id="btn-dit" class="morse-btn">·</button>
                <button id="btn-dah" class="morse-btn">&minus;</button>
            </div>
        </main>

        <!-- ── Results overlay ─────────────────────────────── -->
        <div id="results" class="hidden" role="dialog" aria-labelledby="results-heading">
            <div id="results-grid" role="list">
                <div class="result-stat" role="listitem">
                    <span class="result-value" id="result-cpm">0</span>
                    <span class="result-label">chars / min</span>
                </div>
                <div class="result-stat" role="listitem">
                    <span class="result-value" id="result-accuracy">100</span>
                    <span class="result-label">accuracy</span>
                </div>
                <div class="result-stat" role="listitem">
                    <span class="result-value" id="result-time">0s</span>
                    <span class="result-label">time</span>
                </div>
                <div class="result-stat" role="listitem">
                    <span class="result-value" id="result-chars">0</span>
                    <span class="result-label">chars</span>
                </div>
                <div class="result-stat" role="listitem">
                    <span class="result-value" id="result-words">0</span>
                    <span class="result-label">words</span>
                </div>
                <div class="result-stat" role="listitem">
                    <span class="result-value" id="result-streak-max">0</span>
                    <span class="result-label">best streak</span>
                </div>
            </div>

            <div id="result-chart-container">
                <canvas id="result-chart" width="700" height="200" aria-label="CPM chart"></canvas>
            </div>

            <div id="result-sentence">
                <span id="result-sentence-text"></span>
            </div>

            <button id="restart-btn">next &rarr;</button>
        </div>

        <!-- ── History bar ─────────────────────────────────── -->
        <div id="history-bar" role="region" aria-label="Character history">
            <div id="history-list"></div>
        </div>

        <script src="scripts/main.js"></script>
    </body>
</html>
