<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>morsed</title>
        <meta name="description" content="Practice Morse code with real words and sentences" />
        <meta name="theme-color" content="#111" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⎍</text></svg>" />
        <link rel="stylesheet" href="styles/style.css" />
    </head>
    <body>
        <!-- ── Top bar ─────────────────────────────────────── -->
        <header id="top">
            <div id="logo" class="clickable" onclick="startSession()">morsed</div>
            <div id="timer-modes">
                <button class="timer-btn active" data-time="30">30s</button>
                <button class="timer-btn" data-time="60">1m</button>
                <button class="timer-btn" data-time="180">3m</button>
            </div>
            <button id="mute-btn" class="mute-btn" title="Mute sounds">
                <svg id="mute-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M20.807 4.29a1 1 0 0 0-1.415 1.415 8.913 8.913 0 0 1 0 12.59 1 1 0 0 0 1.415 1.415 10.916 10.916 0 0 0 0-15.42Z" fill="currentColor"/>
                    <path d="M18.1 7.291a1 1 0 0 0-1.42 1.415 4.662 4.662 0 0 1 0 6.588 1 1 0 0 0 1.42 1.415 6.666 6.666 0 0 0 0-9.418Z" fill="currentColor"/>
                    <path d="M13.82.2A12.054 12.054 0 0 0 6.266 5H5a5.008 5.008 0 0 0-5 5v4a5.008 5.008 0 0 0 5 5h1.266a12.059 12.059 0 0 0 7.554 4.8.917.917 0 0 0 .181.017 1 1 0 0 0 1-1V1.186A1 1 0 0 0 13.82.2ZM13 21.535a10.083 10.083 0 0 1-5.371-4.08A1 1 0 0 0 6.792 17H5a3 3 0 0 1-3-3v-4a3 3 0 0 1 3-3h1.8a1 1 0 0 0 .837-.453A10.079 10.079 0 0 1 13 2.465Z" fill="currentColor"/>
                </svg>
            </button>
            <div id="stats">
                <div class="stat" id="stat-timer">
                    <span class="stat-value" id="timer-value">30s</span>
                    <span class="stat-label">time</span>
                </div>
                <div class="stat" id="stat-cpm">
                    <span class="stat-value" id="cpm-value">0</span>
                    <span class="stat-label">cpm</span>
                </div>
                <div class="stat" id="stat-accuracy">
                    <span class="stat-value" id="accuracy-value">100</span>
                    <span class="stat-label">%</span>
                </div>
                <div class="stat" id="stat-streak">
                    <span class="stat-value" id="streak-value">0</span>
                    <span class="stat-label">streak</span>
                </div>
            </div>
        </header>

        <!-- ── Main typing area ────────────────────────────── -->
        <main id="main">
            <!-- Word track (line of words) -->
            <div id="word-track-container">
                <div id="word-track"></div>
            </div>

            <!-- Character track within current word -->
            <div id="char-track-container">
                <div id="char-track"></div>
            </div>

            <!-- Current character + Morse input -->
            <div id="input-area">
                <div id="current-character">
                    <span id="char-display"></span>
                    <span id="cursor">|</span>
                </div>
                <div id="morse-output">
                    <span id="morse-chars"></span>
                </div>
            </div>

            <!-- Subtle hints -->
            <div id="hints">
                <span class="hint-key">.</span> dit &middot;
                <span class="hint-key">⎵</span> dah
            </div>

            <!-- Mobile-only dit / dah buttons -->
            <div id="mobile-controls">
                <button id="btn-dit" class="morse-btn">·</button>
                <button id="btn-dah" class="morse-btn">−</button>
            </div>
        </main>

        <!-- ── Results overlay ─────────────────────────────── -->
        <div id="results" class="hidden">
            <div id="results-grid">
                <div class="result-stat">
                    <span class="result-value" id="result-cpm">0</span>
                    <span class="result-label">chars / min</span>
                </div>
                <div class="result-stat">
                    <span class="result-value" id="result-accuracy">100</span>
                    <span class="result-label">accuracy</span>
                </div>
                <div class="result-stat">
                    <span class="result-value" id="result-time">0s</span>
                    <span class="result-label">time</span>
                </div>
                <div class="result-stat">
                    <span class="result-value" id="result-chars">0</span>
                    <span class="result-label">chars</span>
                </div>
                <div class="result-stat">
                    <span class="result-value" id="result-words">0</span>
                    <span class="result-label">words</span>
                </div>
                <div class="result-stat">
                    <span class="result-value" id="result-streak-max">0</span>
                    <span class="result-label">best streak</span>
                </div>
            </div>

            <div id="result-chart-container">
                <canvas id="result-chart" width="700" height="200"></canvas>
            </div>

            <div id="result-sentence">
                <span id="result-sentence-text"></span>
            </div>

            <button id="restart-btn">next &rarr;</button>
        </div>

        <!-- ── History bar ─────────────────────────────────── -->
        <div id="history-bar">
            <div id="history-list"></div>
        </div>

        <script src="scripts/main.js"></script>
    </body>
</html>
